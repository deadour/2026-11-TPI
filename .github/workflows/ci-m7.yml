name: Probar build del M7

on:
  push:
    branches: [devops/ci-m7]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir imagen
        run: docker build -f backend/Dockerfile -t m7-grupo11 .

      - name: Entrar a Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar imagen
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          image="${DOCKERHUB_USERNAME}/m7-grupo11:${GITHUB_SHA}"
          docker tag m7-grupo11 "$image"
          docker push "$image"
